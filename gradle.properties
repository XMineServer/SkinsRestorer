# Gradle properties
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
# org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
org.gradle.console=rich
org.gradle.warning.mode=all

maven_version=15.12.5
# XMine start - номер сборки форка
# Полная версия собирается в build.gradle.kts: <maven_version>-xmine.<xmineBuild>.
# maven_version остаётся ровно апстримным, чтобы перенос правок на новый тег
# не упирался в конфликт по этой строке.
xmineBuild=2
# XMine end - номер сборки форка
paperVersion=1.8-26.1.1
velocityVersion=3.0-3.4
waterfallVersion=1.17-1.21

# Minecraft properties
modMcVersion=26.2
# Mod loaders
fabric_loader_version=0.19.3
neoforge_version=26.2.0.26-beta
# Mod dependencies
fabric_api_version=0.152.1+26.2
cloud_fabric_version=2.0.0
cloud_neoforge_version=2.0.0
fabric_permissions_api_version=0.7.0
